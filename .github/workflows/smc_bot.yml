name: 24-7 SMC Forex & Metals Scanner Bot

on:
  schedule:
    # Berjalan otomatis setiap 5 menit dari Senin sampai Jumat (24 Jam Market Buka)
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Kirim Sinyal Tes ke Telegram Sekarang?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Restore Cooldown Cache (Anti-Spam)
        uses: actions/cache@v4
        with:
          path: state_cooldown.json
          key: smc-cooldown-state-${{ github.run_id }}
          restore-keys: |
            smc-cooldown-state-

      - name: Run SMC Market Scanner or Test Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ACCOUNT_BALANCE: "1000.0"
          RISK_PERCENT: "1.0"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_notification }}" = "true" ]; then
            python main.py --test-notif
          fi
          python main.py --once
